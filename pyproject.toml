[project]
name = "fluxget-backend"
version = "0.1.0"
description = "FluxGet FastAPI backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.2",
  "pydantic==2.11.10",
  "uvicorn[standard]==0.35.0",
  "yt-dlp==2026.8.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
