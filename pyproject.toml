[project]
name = "fluxget-backend"
version = "0.1.0"
description = "FluxGet FastAPI backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.11.10",
  "uvicorn[standard]==0.52.4",
  "yt-dlp==2026.8.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
  "pre-commit>=4.6.2,<5",
  "ruff>=0.16.5,<0.17",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
